<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fit duel</title>
<style>
  :root { color-scheme: dark; --bg: #111418; --panel: #1a1f25; --rule: #2c333c; --ink: #e9edf1; --muted: #8d98a5; --accent: #f2a33a; --good: #4fbf7f; --bad: #e0605a; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--ink); min-height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; gap: 1rem; align-items: center; justify-content: space-between; padding: .75rem 1.25rem; border-bottom: 1px solid var(--rule); flex-wrap: wrap; }
  header b { color: var(--accent); }
  .stats { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  details { position: relative; }
  summary { cursor: pointer; color: var(--muted); font-size: .85rem; }
  .settings { position: absolute; right: 0; top: 1.6rem; z-index: 2; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 1rem; width: min(90vw, 26rem); display: grid; gap: .75rem; }
  .settings fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: .25rem .9rem; }
  .settings legend { color: var(--muted); font-size: .8rem; margin-bottom: .25rem; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 1.25rem; gap: 1rem; }
  h1 { margin: 0; font-size: clamp(1.25rem, 2.6vw, 1.9rem); text-align: center; font-weight: 500; }
  h1 em { font-style: normal; color: var(--accent); font-weight: 700; }
  .duel { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; width: min(100%, 1100px); }
  .card { all: unset; cursor: pointer; background: var(--panel); border: 2px solid var(--rule); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; gap: .5rem; transition: border-color .1s, transform .1s; min-width: 0; }
  .card:hover, .card:focus-visible { border-color: var(--accent); }
  .card.picked { border-color: var(--good); transform: scale(.98); }
  .img { height: clamp(160px, 34vh, 340px); display: grid; place-items: center; background: #fff; border-radius: 8px; overflow: hidden; }
  .img img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .img .none { color: #888; }
  .brand { color: var(--muted); font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  .name { font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
  .meta, .facts { color: var(--muted); font-size: .85rem; }
  .facts { display: flex; flex-wrap: wrap; gap: .3rem; }
  .facts span { background: #232a32; border-radius: 4px; padding: .05rem .4rem; }
  .current { font-size: .8rem; color: var(--accent); }
  .key { margin-left: auto; color: var(--muted); font-size: .75rem; border: 1px solid var(--rule); border-radius: 4px; padding: 0 .35rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
  .actions button { background: var(--panel); color: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: .55rem .9rem; font: inherit; cursor: pointer; }
  .actions button:hover { border-color: var(--accent); }
  .actions kbd { color: var(--muted); font-size: .75rem; margin-left: .35rem; }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .toast { color: var(--muted); font-size: .85rem; min-height: 1.2em; }
  a { color: var(--muted); }
  @media (max-width: 640px) { .duel { grid-template-columns: 1fr 1fr; gap: .5rem; } .card { padding: .5rem; } .img { height: 26vh; } .name { font-size: .95rem; } .facts { display: none; } }
</style>
</head>
<body>
<header>
  <div><b>Fit duel</b> <span class="stats" id="stats"></span></div>
  <details>
    <summary>Settings</summary>
    <form class="settings" id="settings">
      <fieldset id="use-cases"><legend>Use cases</legend></fieldset>
      <fieldset id="pools"><legend>Product pools</legend></fieldset>
      <fieldset><legend>Options</legend>
        <label><input type="checkbox" name="discontinued"> Include discontinued</label>
        <label><input type="checkbox" name="scores"> Show current scores</label>
      </fieldset>
    </form>
  </details>
</header>
<main>
  <h1 id="question">Loading…</h1>
  <div class="duel">
    <button class="card" id="card-a" data-side="a"></button>
    <button class="card" id="card-b" data-side="b"></button>
  </div>
  <div class="actions">
    <button data-result="tie">About the same<kbd>↓</kbd></button>
    <button data-result="both_good" class="good">Both great<kbd>G</kbd></button>
    <button data-result="both_bad" class="bad">Both poor<kbd>P</kbd></button>
    <button data-result="skip">Don't know<kbd>Space</kbd></button>
    <button id="undo">Undo<kbd>U</kbd></button>
  </div>
  <div class="toast" id="toast"></div>
</main>
<script type="module">
const USE_CASES = { modern_jet: 'modern jet', heli: 'helicopter', ww2: 'WWII warbird', ga: 'general aviation', airliner: 'airliner', space_hotas: 'space sim (HOTAS)', space_hosas: 'space sim (dual stick, HOSAS)' };
const POOLS = { sticks: 'Sticks & grips', bases: 'Stick bases', throttles: 'Throttles, quadrants & collectives', yokes: 'Yokes', pedals: 'Pedals', modules: 'Modules & panels' };
const NOUN = { sticks: 'stick', bases: 'stick base', throttles: 'throttle / collective', yokes: 'yoke', pedals: 'set of pedals', modules: 'module' };
const CONTROL = { button: 'buttons', hat: 'hats', trigger: 'triggers', analog_ministick: 'ministicks', encoder: 'encoders', toggle: 'toggles', lever: 'levers' };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stored = JSON.parse(localStorage.getItem('fit-duel') ?? '{}');
const settings = { useCases: stored.useCases ?? Object.keys(USE_CASES), pools: stored.pools ?? ['sticks', 'bases', 'throttles', 'yokes', 'pedals'], discontinued: stored.discontinued ?? false, scores: stored.scores ?? false };

const items = new Map((await (await fetch('/api/items')).json()).map((i) => [i.id, i]));
let votes = await (await fetch('/api/votes')).json();
let session = 0, duel = null, busy = false;

function renderSettings() {
  $('use-cases').innerHTML = '<legend>Use cases</legend>' + Object.entries(USE_CASES).map(([k, v]) => `<label><input type="checkbox" name="uc" value="${k}" ${settings.useCases.includes(k) ? 'checked' : ''}> ${v}</label>`).join('');
  $('pools').innerHTML = '<legend>Product pools</legend>' + Object.entries(POOLS).map(([k, v]) => `<label><input type="checkbox" name="pool" value="${k}" ${settings.pools.includes(k) ? 'checked' : ''}> ${v}</label>`).join('');
  $('settings').discontinued.checked = settings.discontinued;
  $('settings').scores.checked = settings.scores;
}
$('settings').addEventListener('change', () => {
  const f = $('settings');
  settings.useCases = [...f.querySelectorAll('[name=uc]:checked')].map((i) => i.value);
  settings.pools = [...f.querySelectorAll('[name=pool]:checked')].map((i) => i.value);
  settings.discontinued = f.discontinued.checked;
  settings.scores = f.scores.checked;
  localStorage.setItem('fit-duel', JSON.stringify(settings));
  next();
});

function card(item, side) {
  const controls = Object.entries(item.controls).map(([t, n]) => `${n} ${CONTROL[t] ?? t}`).join(' · ');
  const current = settings.scores ? `<div class="current">Current ${USE_CASES[duel.use_case]} fit: ${item.fit[duel.use_case]}${item.fit_explicit ? '' : ' (default)'}</div>` : '';
  return `<div class="img">${item.image ? `<img src="${esc(item.image)}" alt="">` : '<span class="none">no image</span>'}</div>
    <div style="display:flex;align-items:baseline"><span class="brand">${esc(item.brand)}</span><span class="key">${side === 'a' ? '← / A' : '→ / B'}</span></div>
    <div class="name">${esc(item.name)}</div>
    <div class="meta">${esc(item.category.replace('_', ' '))}${item.price ? ' · ' + esc(item.price) : ''}${item.status !== 'current' ? ' · ' + esc(item.status) : ''}</div>
    ${controls ? `<div class="meta">${esc(controls)}</div>` : ''}
    <div class="facts">${item.facts.map((f) => `<span>${esc(f)}</span>`).join('')}</div>${current}`;
}

function renderStats() {
  const real = votes.filter((v) => v.result !== 'skip');
  const per = Object.keys(USE_CASES).map((u) => `${u.replace('space_', 'sp_')} ${real.filter((v) => v.use_case === u).length}`).join(' · ');
  $('stats').textContent = `${real.length} votes (${session} this session) — ${per}`;
}

async function next() {
  const q = new URLSearchParams({ use_cases: settings.useCases.join(','), pools: settings.pools.join(',') });
  if (settings.discontinued) q.set('include_discontinued', '1');
  duel = await (await fetch('/api/next?' + q)).json();
  if (!duel) { $('question').textContent = 'Nothing to compare with these settings.'; $('card-a').innerHTML = $('card-b').innerHTML = ''; return; }
  const a = items.get(duel.a), b = items.get(duel.b);
  $('question').innerHTML = `For <em>${USE_CASES[duel.use_case]}</em> flying, which ${NOUN[a.pool]} do you prefer?`;
  $('card-a').innerHTML = card(a, 'a');
  $('card-b').innerHTML = card(b, 'b');
  for (const el of document.querySelectorAll('.picked')) el.classList.remove('picked');
  renderStats();
}

async function vote(result) {
  if (!duel || busy) return;
  busy = true;
  if (result === 'a' || result === 'b') $('card-' + result).classList.add('picked');
  try {
    const res = await fetch('/api/votes', { method: 'POST', body: JSON.stringify({ ...duel, result }) });
    if (!res.ok) throw new Error(await res.text());
    votes.push(await res.json());
    if (result !== 'skip') session++;
    $('toast').textContent = '';
    await next();
  } catch (e) { $('toast').textContent = 'Vote not saved: ' + e.message; }
  busy = false;
}

async function undo() {
  if (busy) return;
  busy = true;
  const removed = await (await fetch('/api/votes/last', { method: 'DELETE' })).json();
  if (removed) {
    votes.pop();
    if (removed.result !== 'skip') session = Math.max(0, session - 1);
    duel = { use_case: removed.use_case, a: removed.a, b: removed.b };
    const a = items.get(duel.a), b = items.get(duel.b);
    $('question').innerHTML = `For <em>${USE_CASES[duel.use_case]}</em> flying, which ${NOUN[a.pool]} do you prefer?`;
    $('card-a').innerHTML = card(a, 'a'); $('card-b').innerHTML = card(b, 'b');
    for (const el of document.querySelectorAll('.picked')) el.classList.remove('picked');
    $('toast').textContent = `Undid: ${a.name} vs ${b.name} (${removed.result})`;
    renderStats();
  }
  busy = false;
}

for (const el of document.querySelectorAll('[data-side]')) el.addEventListener('click', () => vote(el.dataset.side));
for (const el of document.querySelectorAll('[data-result]')) el.addEventListener('click', () => vote(el.dataset.result));
$('undo').addEventListener('click', undo);
document.addEventListener('keydown', (e) => {
  if (e.target.closest?.('form') || e.ctrlKey || e.metaKey || e.altKey) return;
  const map = { ArrowLeft: 'a', a: 'a', ArrowRight: 'b', b: 'b', ArrowDown: 'tie', s: 'tie', g: 'both_good', p: 'both_bad', ' ': 'skip' };
  const key = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (key === 'u' || key === 'Backspace') { e.preventDefault(); undo(); }
  else if (map[key]) { e.preventDefault(); vote(map[key]); }
});

renderSettings();
next();
</script>
</body>
</html>
