verdict:
  author: feiko
  hands_on: true
  owned_hours: 800
  take: The quintessential starter HOTAS for DCS, MSFS, and Elite. Outstanding control density on the throttle paired
    with accurate hall sensors on the stick.
  pros:
  - Most complete starter package for under €150
  - Abundant controls on throttle grip (ministick, rocker, hats)
  - Magnetic hall sensors on primary X/Y stick axes
  cons:
  - Twist potentiometer failure risk on stick
  - Throttle slide stiction needs Nyogel 767A lube
  great_for:
  - modern_jet
  - space_hotas
  skip_if:
  - You can stretch budget to VKB Gladiator EVO
