  notes: Corrected prior trim-wheel slider to encoder; wheel function implies incremental
    digital adjustment but its electronic implementation is undocumented. Four lever
    bodies are installed; alternate caps/inlays are not extra controls. The same page
    calls flap detents optional and also says included detent inlays, while the box-contents
    list names the commercial and GA lever sets and does not list the inlays. Inlay
    count and electrical contacts are not published. Spring-loaded parking brake behavior
    is stated, but switch electrical behavior and detent count are not. No button/hat
    counts are specified.
