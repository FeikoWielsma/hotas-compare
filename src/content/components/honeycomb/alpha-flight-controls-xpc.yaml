controls_evidence:
  coverage: complete
  source: https://flyhoneycomb.com/products/alpha-flight-controls-xpc
  checked: '2026-10-20'
  notes: 'Shared full-size Alpha inventory: one left-handle 8-way POV, four 2-way
    handle rockers, four handle buttons, four master/avionics panel switches, five
    lighting panel switches and five-position ignition selector. Panel labels/counts
    are visible in the Honeycomb default-setup diagram supplied by the owner and product
    photos; switch off-position electrical mappings are not inferred. The current
    product page prose says both handles have an 8-way POV, three buttons and PTT,
    while its specific callouts show one POV and two buttons per handle; PTT inclusion
    and per-handle count therefore remain unresolved. XPC additionally has four Xbox/navigation
    buttons. The original Alpha has no Xbox navigation group. Physical inventory completeness
    uses the owner-supplied Honeycomb default mapping diagram; optional click, lighting
    and switch contact behavior may still be unspecified. The product page states
    red LED backlighting for the switch panel. That does not establish backlight
    on the handle buttons.'
