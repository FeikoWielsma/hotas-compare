controls_evidence:
  coverage: complete
  source: https://flyhoneycomb.com/products/bravo-throttle-quadrant
  checked: '2026-10-20'
  notes: Six levers are installed slots. Box contents include both commercial and
    general-aviation lever sets as alternate caps, not twelve levers. Official photographs
    show a 0–100 scale with a FLIGHT DETENT mark and a REVERSE region, a Go Around
    push button on a lever head, a separate UP/DOWN lever, and a gear panel labeled
    N, L and R. Those photographs do not identify electrical end contacts, which cap
    set is factory-installed, or whether N/L/R are lever positions or indicator legends.
    The separate Flap Kit (5-, 7- and 9-detent plates) is a different SKU, is not
    in the Bravo box, and is not installed inventory. The current downloads page publishes
    the landing-gear LED driver only, not a lever-contact map. Trim-wheel encoding
    remains unpublished. Indicator lights are outputs, not controls.
