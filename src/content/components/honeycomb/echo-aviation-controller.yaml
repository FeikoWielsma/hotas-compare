controls_evidence:
  coverage: partial
  source: https://flyhoneycomb.com/products/echo-aviation-controller
  checked: '2026-10-21'
  notes: >-
    Official product page identifies a 16-bit Hall-effect thumbstick for pitch and roll, four detented sliders with
    interchangeable caps (throttle, flaps, speed brakes), three tactile levers (flaps, parking brake, gear), a trim wheel
    and assignable switches. The official product image shows the top buttons, a left diamond cluster of four round
    buttons, four sliders, three lever stems on the lower edge and a concentric round control at upper left. The
    upper-left control is not named in any text and is not classified, so coverage stays partial. The left cluster is
    itemized from the image only; its mapping is unset. The page does not state how many assignable switches there are,
    so none are counted. Weight is left unset: the page gives 564 g only with the full set, travel case and accessories.
