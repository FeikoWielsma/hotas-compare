brand: logitech
name: Logitech G X52 Flight Stick
category: stick_fixed
status: current
handedness: right
mount: null
controls:
- type: trigger
  location: grip
  stages: 2
  count: 1
  action: sequential
  label: Two-stage metal trigger
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
- type: button
  location: grip
  label: Backlit fire buttons
  count: 3
  backlit: true
  notes: The standard X52 manual product-tour diagram labels three buttons on the
    joystick head.
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
- type: button
  location: grip
  backlit: false
  count: 1
  label: Missile launcher button
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
- type: hat
  location: grip
  ways: 8
  push: false
  count: 2
  label: Hat switches
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
- type: toggle
  location: grip
  ways: 3
  momentary: false
  push: false
  label: Mode selector
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
- type: toggle
  location: base
  count: 3
  ways: 3
  momentary: true
  push: false
  label: Spring-loaded base switches
  notes: Three spring-loaded switches provide six programmed commands (each switch
    has two momentary directions with center neutral).
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
- type: switch
  location: grip
  positions: 2
  momentary: false
  push: false
  label: Metal pinkie switch
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
controls_evidence:
  coverage: complete
  source: https://www.logitech.com/assets/65328/2/x52-hotas.pdf
  checked: '2026-10-20'
  notes: Standard X52 manual product-tour pages 3-4 visually label the two-stage trigger,
    three backlit stick-head fire buttons, two 8-way hats, pinkie switch, missile-launcher
    button, mode selector and three spring-loaded base switches. Programmable command
    totals are not treated as physical button counts.
