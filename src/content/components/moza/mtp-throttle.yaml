  checked: '2026-10-20'
  notes: >-
    Verified against official MTP Throttle Panel user manual (page 2 panel diagram, rendered at high resolution). Panel
    itemizes 19 controls (8 toggles, 3 switches, 6 rotaries/selectors, 1 button, 1 slider). The manual and support article
    state 27 physical switches in total; the 8-control gap is not located in the diagram (grip-side and hidden controls
    are not drawn), so it is not added as a count. Grip: 2 throttle levers, 2 detents, 1 Hall thumb joystick (existing).
    Coverage stays partial.
