  notes: Verified against official MFY Pro user manual (pages 3-5). Physical handle controls comprise 2 Hall-effect thumbsticks
    (Auxiliary Axis, POV Control Axis; software configurable to Axis, Button, or Mixed modes), 2 hat switches (Trim switch,
    View switch; configurable as 5 independent buttons or 8-way D-pad), 2 AP Disconnect pushbuttons, 2 Push-to-talk pushbuttons,
    and 2 Hall-effect analog triggers on the back (configurable as combined Z-axis or separate Z-axis and Slider axis).
    The center module features a full-color touchscreen display providing timer, axis display, button test, checklist,
    and flight instruments; touchscreen interface contains no discrete physical buttons. Unlike the standard MFY Handle,
    there are no physical center-panel pushbuttons.
