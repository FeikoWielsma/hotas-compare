  source: https://back.mozaracing.com/wp-content/uploads/2025/manual/MFY-Yoke-Handle-Manual.pdf
  checked: '2026-10-31'
  notes: >-
    Exact MFY Yoke Handle quick guide, Buttons / Switches Description (page 1), inspected as a rendered page. Its
    17 callouts cover the whole handle. The two axis switches are the Hall effect joysticks, the Trim and View
    switches are the 8-way switches, callouts 15 and 17 are the LB/RB buttons, and callout 16 (Rudder Axis) marks
    the two triggers. The two AP Disconnect buttons were missing from the earlier record. "Up to 34 signals" is a
    mapping total, not a physical count. Hat push and trigger stages are not stated. Dimensions are unlabeled
    (142.5 x 202 x 313 mm) and are not assigned to width/depth/height.
