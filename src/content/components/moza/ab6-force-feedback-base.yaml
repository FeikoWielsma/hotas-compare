verdict:
  author: feiko
  hands_on: false
  take: "MOZA's entry-level 6Nm direct drive force feedback flight base. While more accessible in price than the AB9, the lower torque headroom limits fidelity in high-G maneuvers and aerodynamic force saturation."
  pros:
    - "Direct drive active force feedback at lower price point"
    - "Aviation-grade aluminum housing"
  cons:
    - "Noticeably less dynamic headroom and torque authority than the AB9"
    - "Requires dedicated desk or cockpit mounting due to motor weight"
  great_for:
