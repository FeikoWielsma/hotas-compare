  notes: 'Default supplied grips are TQF fighter type; TQA/TQB are alternatives. The official product page explicitly itemizes 10 multifunction buttons, 3 rotary knobs, 3 toggle switches, and a landing-gear lever; the six RGB-backlit buttons are a subset/description, not added to the ten. The page also names three toggle switches, but their number of positions is unspecified; since the schema defaults an omitted toggle-way count to two, those three known switches are noted here and not added to the structured array. The same page says 23 physical controls while its specs report 17 physical toggle switches, so panel inventory is partial and no extra controls are inferred from those aggregates. TQF layout has two throttle axes plus flap and speedbrake axes per manual.'
