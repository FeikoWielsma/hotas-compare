  source: https://cdn.shopify.com/s/files/1/0937/0802/6176/files/moza_mtq_throttle_panel_manual.pdf?v=1779862954
  checked: '2026-10-20'
  notes: Verified against official MTQ manual and support article (70000679590). Ships with default TQF fighter grips
    (two throttle axes) plus independent flap and speedbrake levers (4 independent continuous axes total). Front panel
    houses 1 dedicated landing gear lever, 10 multifunction pushbuttons (6 of which are 16.7M RGB backlit), 3 rotary
    knobs, and 17 toggle switch inputs. The "23 physical controls" marketing summary refers to grouped physical control
    stations rather than the full itemized electrical switch total (31 total discrete inputs).
