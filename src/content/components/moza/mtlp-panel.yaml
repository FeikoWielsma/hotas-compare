controls_evidence:
  coverage: complete
  source: https://cdn.shopify.com/s/files/1/0937/0802/6176/files/moza_mtlp_panel_manual.pdf?v=1779862892
  checked: '2026-10-20'
  notes: >-
    Reconciled official marketing specification of "25 switch signals" with physical panel controls. The 25 count
    is a logical DirectInput signal total across all multi-position switches and levers (e.g. 5 JETT positions, JETT push,
    3 flap positions, landing gear up/down, hook positions, parking brake pull/turn signals, and 2-way toggles). The
    actual hardware houses 10 physical controls: 1 multi-position rotary selector with center push button, 5 toggle
    switches (one 3-way flap, four 2-way), and 3 levers (landing gear lever, Hall-effect tailhook lever, and Hall-effect
    pull-and-turn parking brake lever). There are no gun triggers; previous reference to 2 triggers was a machine translation artifact.
