  notes: >-
    Counted from the MH16 user manual diagram (page 2, 170 dpi and 400 dpi crops) and the Chinese page 7 list
    (two-stage trigger). Core grip has nine labelled controls: weapon release, NWS and FOV buttons, trigger, trim
    switch and DMS (hats), TMS and CMS (type not identified), paddle.
    MOZA describes a detachable side expansion (5-way hat + 3-position selector) that is not in the box list and is
    not stated as included or sold separately, so those controls are excluded. The official page gives 30 programmable
    inputs on the product page and 27 in the overview; neither is treated as a physical-control count.
