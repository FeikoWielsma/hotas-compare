controls_evidence:
  coverage: complete
  source: https://acpv.prod.turtlebeach.com/support/qig/en/33/velocityone-flightdeck.pdf
  checked: '2026-10-20'
  notes: Visually reconciled the official quick-guide physical control diagrams with the full product-guide
    tables. Direction contacts, center clicks, dual-stage trigger and lever end contacts remain attached to
    their physical controls. Virtual throttle detent buttons and configurable touchscreen cells are excluded
    from physical button counts. The clickable FIRE touchpad is recorded once with its mouse-axis behavior
    noted. Fifteen published controller axes exclude its separate mouse X/Y outputs. Optional switch
    return behavior and undocumented click/backlight properties remain unknown. Combined mass is stick
    1460 g plus throttle 1510 g; no single overall assembled dimension is published.
