  source: https://support.turtlebeach.com/articles/en_US/Knowledge/4409140258715-VelocityOne-Flight-Features-And-Controls
  checked: '2026-10-19'
  notes: 'Records controls named in the support guide: handle POV/HATs, triggers, seven throttle/prop/mixture levers, quadrant buttons and detents, Xbox controls, FMD buttons, and trim wheel. Manufacturer also advertises 18 assignable buttons but does not reconcile that total with physical-control naming; aggregate was not used. Trigger behavior, POV diagonal gating/push, and wheel encoding are unspecified. Rotary analog approximates the trim-wheel axis because schema has no wheel-axis type. Xbox navigation mappings may reuse flight controls, so unverified console-only button groups are not counted again. Lever detent contacts stay attached to their levers. Hardware axis names cover the ten directly documented yoke/quadrant movements; rudder-trigger output encoding remains unconfirmed. Prior toe-brake and twist axis names did not belong to this yoke system and were removed.'
