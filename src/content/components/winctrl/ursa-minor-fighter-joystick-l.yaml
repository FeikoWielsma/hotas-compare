  source: https://eu.winctrl.com/static/download/QmabSXmvPxNp2ZXHidaDhGq73XGHyKicn6YWrgQksanXDp?filename=URSA-MINOR-Fighter-Joystick-L-User-Manual-v1.3.pdf
  checked: '2026-10-31'
  notes: >-
    Exact-hand manual, section 2.1 (printed pages 10-11), inspected as rendered pages. The key diagrams and
    mechanical-strength table cover every grip and base control. Keys 21, 23, 29 and 40 are each listed as both a
    multifunctional press switch and direction switch, with four directions around one center key. Keys 45-48 are
    direction events of the mini joystick and keys 49-51 are twist-axis zones, so neither adds a physical control.
    The table's first row repeats key 29 where key 39 would be expected; the diagram still draws 39 as its own
    button. Earlier records listed one hat and omitted the three other multifunction switches, the paddle and the
    four grip buttons. The Z-axis lock screw is mechanical and is excluded.
