controls_evidence:
  coverage: complete
  source: https://eu.winctrl.com/static/download/QmTvHcYNoR17Ro8AHmA7j6jpqwnHHbaYWS8dXGxM8QbTgh?filename=URSA+MINOR-Fighter-Joystick+R-User+Manual+V1.3+20250708.pdf
  checked: '2026-10-31'
  notes: >-
    Exact right-hand manual, section 2.1 (printed pages 7-8), inspected as rendered pages from the cited V1.3
    20250708 file; its cover still reads V1.0 2024.04. The key diagrams and mechanical-strength table cover every
    grip and base control. Keys 21, 23, 29 and 40 are each listed as both a multifunctional press switch and
    direction switch, with four directions around one center key, so the earlier 8-way, no-push hat was wrong. Key
    34 has its own press force. Keys 45-48 are direction events of the mini joystick and keys 49-51 are twist-axis
    zones, so neither adds a physical control. The table's first row repeats key 29 where key 39 would be
    expected; the diagram still draws 39 as its own button. The earlier record omitted the three other
    multifunction switches, the paddle and the four grip buttons. The Z-axis lock screw is mechanical and is
    excluded.
