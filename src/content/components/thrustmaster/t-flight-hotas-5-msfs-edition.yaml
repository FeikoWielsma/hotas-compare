  notes: Support page for this MSFS edition links the T.Flight Hotas 5 manual. PC mapping numbers buttons 1-16 on
    the stick and throttle. Button 1 is the trigger; 2-4 are on the stick head; 5-10 are on the throttle; 11-16 are
    on the base. The hat, throttle axis, twist axis, and rudder rocker are drawn separately. Pedal axes on the same
    page belong to the optional TFRP and are not part of this device. The product page's "14 buttons" is a marketing
    total and is not the numbered physical count. Hat direction count is not stated.
