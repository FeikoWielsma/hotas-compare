  notes: The official product page specifies five axes, 12 buttons, one trigger and one hat. The manual confirms the physical control groups but does not break down the action-button total by push versus switch or state hat ways. The handle resistance dial and rudder locking screw are adjustments, not inputs; the Allen key is for throttle installation.
