  notes: Inventory from the official T.Flight Hotas 4 user manual technical-features list (callouts 1-11) and text.
    The manual shows action buttons (callout 9, several leader lines on handle and throttle) but gives no count, so
    they are not itemised; retailer listings quote 12 action buttons, which is not an official source. The handle
    resistance dial (callout 7) and rudder locking screw (callout 5) are adjustments, not inputs, and the Allen key
    is for throttle installation. The manual has no PC button-numbering diagram.
platform_compatibility:
