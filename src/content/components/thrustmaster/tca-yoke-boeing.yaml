  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Yoke_Boeing/TCA_Yoke_Boeing_Edition_user_manual.pdf
  checked: '2026-10-20'
  notes: >-
    The Xbox mapping (manual printed page 7) names 18 buttons, matching the feature-list aggregate, with the 8-way
    hat and axes drawn separately. Push versus switch is not stated for those 18, so they stay one button count. PC
    properties also show buttons 1-18. Feature callout 10 is the landing gear and is not one of the 18. The Xbox/PC
    selector is callout 6. TFRP and TPR rudder axes belong to the optional pedals and are not on this device.
