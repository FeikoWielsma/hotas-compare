- type: button
  count: 16
  location: handle
  label: Physical buttons (Xbox mapping names Y, X, Prev, B01, B02, F1, A, B03, Next, B04, B, F2, Menu, Share, View, XBOX)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Yoke_Boeing/TCA_Yoke_Boeing_Edition_user_manual.pdf
- type: analog_ministick
  push: true
  count: 1
  label: Mini-stick (press is mapped as B05)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Yoke_Boeing/TCA_Yoke_Boeing_Edition_user_manual.pdf
- type: switch
  count: 1
  location: base
  label: Landing gear (mapped as B06)
  notes: Feature callout 10. The Xbox mapping leader for B06 ends on this control. Positions are not stated.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Yoke_Boeing/TCA_Yoke_Boeing_Edition_user_manual.pdf
- type: switch
  count: 1
  positions: 2
  location: base
  label: Xbox/PC selector switch
  notes: Selects the host before connection. Not a game input.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Yoke_Boeing/TCA_Yoke_Boeing_Edition_user_manual.pdf
controls_evidence:
  coverage: complete
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Yoke_Boeing/TCA_Yoke_Boeing_Edition_user_manual.pdf
  checked: '2026-10-31'
  notes: >-
    Manual pages 1-2 and the Xbox mapping (printed page 7) inspected as rendered pages. The 18 mapped names
    include two contacts on other controls. The B05 leader ends on the mini-stick, which the feature list calls a
    mini-stick with button, and the B06 leader ends on the landing gear control, so 16 are separate button bodies
    and the earlier 18 plus gear double-counted. The hat and six axes are drawn separately, and the Xbox/PC
    selector is callout 6. TFRP and TPR rudder axes belong to the optional pedals and are not on this device.
