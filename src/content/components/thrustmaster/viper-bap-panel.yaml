controls_evidence:
  coverage: partial
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
  checked: '2026-10-20'
  notes: >-
    Mode A panel map (manual printed page 10) is titled 32 buttons and 1 axis, numbered 22-53. Recorded from that
    drawing: round button 22, switches 23 and 24, selector arcs 25-28, 29-33 and 39-41, four square buttons, and the
    Rz trim wheel. Number 38's leader meets the trim wheel, so it is not a second body. The features list also names
    a landing-gear lever with an indicator light and a programmable LED display. The LED matrix is not a button.
    Which map number is the landing-gear lever, and the bodies for 42-53 (including a two-arrow control and further
    round controls), were not separated cleanly enough to type. Marketing's 43 includes virtual buttons. Coverage
    stays partial.
