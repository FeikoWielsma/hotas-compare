  checked: '2026-10-19'
  notes: Mode A map (manual page 8) lists 32 numbered button inputs and one axis, excluding 11 virtual events; the
    marketing 43 is not a physical count. Represented from the numbered map (round push 1, four square pushbuttons
    (13-16), and three detent knobs with 5 (4-8), 4 (9-12) and 3 (18-20) positions). Trim wheel is the analog axis.
    The remaining numbered inputs (2-3 toggle, 17, 21-32 incl. the B1 rocker and knurled dial) are not classified as
    push, switch or rotary, so they are not counted; the named MODE and PGRM selectors are not matched to a knob.
    Coverage stays partial.
