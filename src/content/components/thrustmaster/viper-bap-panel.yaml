controls_evidence:
  coverage: partial
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
  checked: '2026-10-21'
  notes: >-
    Mode A panel map (manual printed page 10) is titled 32 buttons and 1 axis, numbered 22-53. Recorded from that
    drawing: round button 22, switches 23 and 24, selector arcs 25-28, 29-33 and 39-41, four square buttons, and the
    Rz trim wheel. Number 38's leader meets the trim wheel, so it is not a second body. Features page names the
    landing-gear lever. The backlight section says to press 37 and 44, so 44 is a push button. Numbers 42 and 43 are
    drawn as a pair of curved arrows, and 46-47, 50-51 and 52-53 are drawn as bracketed pairs, but the leader ends
    swapped between reads of the same raster, so those bodies are not typed. The LED matrix is not a button.
    Marketing's 43 includes virtual buttons. Coverage stays partial.
