controls:
- type: lever
  kind: throttle_single
  analog: true
  count: 1
  location: base
  label: Detachable throttle
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: axis
  kind: rudder
  count: 1
  location: handle
  label: Rudder via twisting handle (RZ axis in 4-axis mode)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: rocker
  count: 1
  location: base
  analog: true
  label: Rudder rocking button (combined with twist in 4-axis mode; independent 5th axis in 5-axis mode)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: hat
  count: 1
  location: handle
  label: Multidirectional POV hat-switch
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: button
  count: 12
  label: Action buttons numbered 1-12 on the PC automatic-preset diagram
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: button
  count: 1
  location: base
  label: PRESET button (programming mode select, LED)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: button
  count: 1
  location: base
  label: MAPPING button (programming)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: button
  count: 1
  location: base
  label: HOME button (4/5-axis mode select, LED)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
- type: switch
  count: 1
  location: base
  label: USB selector (set to PC)
  notes: Sets the USB mode before connection; not a game input.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
controls_evidence:
  coverage: complete
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TFHX/t-flight_hotas_X_manual.pdf
  checked: '2026-10-31'
  notes: >-
    Technical-features list (callouts 1-13) and the PC automatic-preset diagram (printed page 5) cover the whole
    device. Buttons 1-4 are on the stick, 5-10 on the throttle and 11-12 on the throttle base, and PRESET, MAPPING
    and HOME are separate buttons. X, Y, Z, RZ and Slider 0 are the axes. Button mechanisms and hat direction
    count are not stated, and the 12 stay one aggregate. The resistance dial, rudder locking screw and Allen key
    are not inputs.
platform_compatibility:
  pc: supported
  xbox: unsupported
  ps5: unsupported
  notes: The user manual cover lists compatibility as PC only. The Thrustmaster product page lists PC and legacy PS3;
    PS4, PS5 and Xbox are not listed.
