controls_evidence:
  coverage: complete
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sky_Yoke_P/TCA_Sky_Yoke_PS_user_manual.pdf
  checked: '2026-10-31'
  notes: >-
    Exact-SKU manual, technical features (printed pages 7-8), control-panel view (page 25) and PC map (page 31)
    inspected as rendered pages. The 24 software buttons are not 24 physical buttons. Contacts 1-4 and 11-14 are
    four two-contact grip controls, 6-8 are the scroll wheel, 9 is the mini-stick, 15-19 are the five selector
    positions, 20-21 are the trim wheel, which the panel calls an encoder, and 5, 10 and 22-24 are buttons. The
    MODE button (callout 7) is physical and unnumbered. Two analog triggers, the built-in throttle, the yoke axes
    and the hat complete the inventory. Scroll-wheel press behavior is not stated. Mounting and USB/RJ12 ports are
    not inputs.
