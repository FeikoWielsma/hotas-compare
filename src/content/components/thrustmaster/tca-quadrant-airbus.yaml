  notes: Standard quadrant without add-ons. Manual pages 1-4 visually distinguish two grip push buttons, two base
    push buttons, two engine master switches, a three-position engine-mode knob and rear engine-pair configuration
    selector. Eight advertised physical button events include switch contacts and are not eight standalone pushbuttons.
    Eight additional axis-region events are virtual. Reverse-thrust latches unlock axis travel rather than adding
    independent buttons.
