  notes: English technical features and right-handed Sol-R mapping confirm two eight-way hats with center
    clicks, a clickable analog ministick, clickable digital scroll wheel, two front buttons and one installed
    rear removable button. The spare rear button and alternative POV mappings are not extra physical controls.
    Two triggers are documented, one dual-position; secondary trigger action remains unspecified.
    Twist plus ministick X/Y provide three analog axes. Includes two STAR cams for AVA; resistance/damping
    belong to the base. English PDF printed pages 7, 8 and 13 provide diagrams.
software: T.A.R.G.E.T. when used with compatible base
