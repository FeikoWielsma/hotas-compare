controls:
- type: lever
  kind: throttle_dual
  analog: true
  count: 2
  location: handle
  label: Thrust levers
  source: https://shop.thrustmaster.com/en_eu/tca-quadrant-boeing-edition.html
- type: lever
  kind: other
  analog: true
  count: 1
  location: handle
  label: Third configurable axis
  notes: Three axes can be configured with four supplied lever types; speedbrake/flaps handle assignment is swappable,
    not four simultaneous axes.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant_Boeing/TCA_Quadrant_Boeing_Edition_user_manual.pdf
- type: button
  count: 6
  location: handle
  label: Thrust-lever buttons, one pair per lever (mapped 1-6, thrust-reverser mechanisms)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant_Boeing/TCA_Quadrant_Boeing_Edition_user_manual.pdf
- type: button
  count: 3
  location: base
  label: Base push buttons (mapped 7-9)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant_Boeing/TCA_Quadrant_Boeing_Edition_user_manual.pdf
- type: toggle
  count: 2
  ways: 2
  location: base
  label: Two base two-position switches (mapped 10-11)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant_Boeing/TCA_Quadrant_Boeing_Edition_user_manual.pdf
- type: encoder
  count: 1
  push: true
  location: base
  label: Autopilot encoder with push (mapped 15-16 rotation, 17 press)
  notes: Mode labels IAS/MACH, HDG/TRK and Altitude (mapped 12-14) are not classified as physical controls.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant_Boeing/TCA_Quadrant_Boeing_Edition_user_manual.pdf
controls_evidence:
  coverage: complete
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant_Boeing/TCA_Quadrant_Boeing_Edition_user_manual.pdf
  checked: '2026-10-20'
  notes: >-
    PC mapping (manual printed page 5) shows three installed analog levers (Xr, Yr, Zr), lever buttons 1-6, base
    buttons 7-9, two-position switches 10 and 11, and one knob whose legend is rotation 15 and 16 plus press 17.
    IAS/MACH 12, HDG/TRK 13 and Altitude 14 are printed mode labels on that knob, not extra bodies. Four supplied
    lever handles are swappable onto the three installed axes. Switch momentary behavior and button backlighting are
    not stated.
