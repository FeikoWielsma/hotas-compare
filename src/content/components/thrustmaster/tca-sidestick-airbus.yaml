controls:
- type: trigger
  count: 1
  location: grip
  stages: 1
  label: Digital trigger
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sidestick/TCA_Sidestick_AE_User_Manual.pdf
- type: hat
  count: 1
  location: grip
  label: Multidirectional point-of-view hat switch (mapped as hat, ways not stated)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sidestick/TCA_Sidestick_AE_User_Manual.pdf
- type: button
  count: 2
  location: handle
  label: Handle-side buttons (mapped 3 and 4)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sidestick/TCA_Sidestick_AE_User_Manual.pdf
- type: button
  count: 12
  location: base
  label: Left and right button modules, six pads each (mapped 5-10 and 11-16)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sidestick/TCA_Sidestick_AE_User_Manual.pdf
- type: switch
  count: 1
  positions: 2
  location: base
  label: Left-handed / right-handed selector
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sidestick/TCA_Sidestick_AE_User_Manual.pdf
- type: lever
  kind: throttle_single
  analog: true
  count: 1
  location: base
  label: Built-in throttle with reverser region
  notes: Reverser is a virtual event at the start of throttle travel, not an extra physical button.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sidestick/TCA_Sidestick_AE_User_Manual.pdf
controls_evidence:
  coverage: complete
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Sidestick/TCA_Sidestick_AE_User_Manual.pdf
  checked: '2026-10-20'
  notes: >-
    Numbered PC map and the feature list. Inputs 3-16 are 14 buttons (2 on the handle, 12 in the two base modules).
    Input 1 is the digital trigger and 2 is the hat. 17 is the virtual throttle reverser and is excluded. The feature
    list's "15 action buttons" is one higher than the numbered button bodies, so the map is used. Hat direction count
    and hat push are not stated. The two base modules are interchangeable, so the 12 pads are counted once. The
    handedness selector is a two-position switch.
