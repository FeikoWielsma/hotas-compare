  notes: >-
    Exact-SKU manual, feature pages and PC map (printed page 23) inspected as rendered pages. The map numbers 16
    buttons, and that total includes the trigger (1) and the small throttle-base button (15, the MODE button).
    Every drawn control is the trigger, one of buttons 2-16, the hat, the mini-stick, the rocker (callout 17,
    Slider 0), the twist axis or the throttle. The product page lists 16 buttons plus a trigger and a High-G Turns
    button, which the manual does not support as extra bodies; the earlier 18-button sum double-counted. Hat ways
    and mini-stick push are not stated. The pedal axes on that map belong to the optional TFRP.
