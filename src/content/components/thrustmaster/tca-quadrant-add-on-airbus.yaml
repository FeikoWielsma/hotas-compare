brand: thrustmaster
name: TCA Quadrant Add-On Airbus Edition
category: module
status: current
handedness: n/a
mount: null
platform_compatibility:
  pc: supported
  xbox: supported
  ps5: unsupported
  notes: The add-on product page lists PC. The Sidestick X manual states this add-on is recognized on Xbox Series
    X|S and Xbox One when connected through TCA Sidestick X. It has no standalone USB connection. PS5 is not listed.
  sources:
  - https://www.thrustmaster.com/en-us/products/tca-quadrant-add-on-airbus-edition/
  - https://ts.thrustmaster.com/download/accessories/Manuals/TCA_sidestick_X/TCA_Sidestick_X_AE_User_manual.pdf
controls:
- type: lever
  kind: speedbrake
  analog: true
  count: 1
  location: panel
  label: Speed brake axis
  notes: Four detents on this axis are associated with five virtual buttons. Those virtual events are not physical buttons.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: detent
  count: 4
  location: panel
  label: Speed-brake axis detents
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: rotary
  count: 1
  location: panel
  label: Speed-brake module thumbwheel (mapped 21)
  notes: Mapping leader 21 ends on the thumbwheel. One button number is printed on it. Analog-versus-selector behavior is not stated.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: switch
  count: 1
  location: panel
  label: Speed-brake module switch (mapped 22-26)
  notes: >-
    Mapping leader 22-26 ends on one body, drawn as a small lever on a round base. Five button
    numbers share that leader. The drawing does not show five detents, so the position count stays unset.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: lever
  kind: flap
  analog: true
  count: 1
  location: panel
  label: Flaps axis
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: detent
  count: 4
  location: panel
  label: Flaps axis detents
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: button
  count: 1
  location: panel
  label: Flaps-module push button (mapped 17)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: toggle
  count: 1
  ways: 2
  location: panel
  label: Flaps-module two-position switch (mapped 18-19)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: rotary
  count: 1
  location: panel
  label: Flaps-module knob (mapped 20)
  notes: One button number on a knob. The page's only axes are the two levers, so this knob is not a third axis. Positions and analog-versus-selector behavior are not stated.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
controls_evidence:
  coverage: partial
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
  checked: '2026-10-21'
  notes: >-
    Mapping page 6 (printed 6/14) numbers 17-31, which is 15 inputs, plus axes Z and ZR. 27-31 sit on the speed-brake
    lever travel and are the five virtual detent buttons. Flaps leaders hit three bodies: round button 17, toggle
    18-19, and knob 20. Speed-brake leader 21 ends on the thumbwheel and leader 22-26 ends on the adjacent lever.
    Those two bodies replace the six-button aggregate. The five numbers on the lever do not show detents, so that
    position count stays unset. One published SKU contains both modules.
hardware:
  axis_count: 2
  axes:
  - name: ZR (speed brake)
  - name: Z (flaps)
connectivity:
  usb: SATA connection to TCA Quadrant Airbus Edition
  standalone_usb: false
