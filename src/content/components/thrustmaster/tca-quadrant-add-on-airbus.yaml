controls_evidence:
  coverage: partial
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
  checked: '2026-10-20'
  notes: English features page calls out a speed-brake axis, four detents plus five virtual buttons, six action
    buttons, a flaps axis, four detents, and four action buttons. Mapping page 6 titles 15 button numbers and two
    axes (Z and ZR). Fifteen equals the ten action buttons plus the five virtual speed-brake events. The legend does
    not say which of the ten are push buttons, paired switch contacts, or the wheel and knob shapes drawn inside the
    flaps bracket, so those ten stay typed as the manual's action buttons. One published SKU contains both modules.
hardware:
