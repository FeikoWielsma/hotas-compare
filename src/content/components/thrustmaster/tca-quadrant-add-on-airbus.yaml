controls:
- type: lever
  kind: speedbrake
  analog: true
  count: 1
  location: panel
  label: Speed brake axis
  notes: Four detents on this axis are associated with five virtual buttons. Those virtual events are not physical buttons.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: detent
  count: 4
  location: panel
  label: Speed-brake axis detents
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: button
  count: 6
  location: panel
  label: Speed-brake module action buttons
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: lever
  kind: flap
  analog: true
  count: 1
  location: panel
  label: Flaps axis
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: detent
  count: 4
  location: panel
  label: Flaps axis detents
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: button
  count: 1
  location: panel
  label: Flaps-module push button (mapped 17)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: toggle
  count: 1
  ways: 2
  location: panel
  label: Flaps-module two-position switch (mapped 18-19)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
- type: rotary
  count: 1
  location: panel
  label: Flaps-module knob (mapped 20)
  notes: One button number on a knob. The page's only axes are the two levers, so this knob is not a third axis. Positions and analog-versus-selector behavior are not stated.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
controls_evidence:
  coverage: partial
  source: https://ts.thrustmaster.com/download/accessories/Manuals/TCA_Quadrant/TCA_Quadrant_Add-On_Airbus_Edition_user_manual.pdf
  checked: '2026-10-20'
  notes: >-
    Mapping page 6 (printed 6/14) numbers 17-31, which is 15 inputs, plus axes Z and ZR. 27-31 sit on the speed-brake
    lever travel and are the five virtual detent buttons. Flaps leaders hit three bodies: round button 17, toggle
    18-19, and knob 20. Those replace the flaps "4 action buttons" aggregate. Speed-brake callout 3 still brackets a
    thumbwheel and a toggle under action buttons 21 and 22-26; the leaders do not separate those six numbers onto
    individual bodies, so that group stays an action-button aggregate. One published SKU contains both modules.
hardware:
  axis_count: 2
  axes:
  - name: ZR (speed brake)
  - name: Z (flaps)
