  notes: English manual pages 6-7 and mapping page 14 visually establish three standalone buttons, one
    two-position toggle, clickable ministick, two four-way hats, one eight-way POV, analog radio rotary
    knob, self-centering rudder rocker and throttle. Toggle outputs 4/5 are one physical control; ministick
    click 6 is integrated. Five named axes are documented. Pages 16-18 establish one repositionable detent
    part with four configurations, not four installed detent controls. Undocumented hat clicks and button
    backlighting remain unset.
