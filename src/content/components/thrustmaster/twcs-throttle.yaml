controls_evidence:
  coverage: complete
  source: https://ts.thrustmaster.com/download/pictures/PCMAC/TWCS/TWCS_PC_Generic_Mapping.pdf
  checked: '2026-10-19'
  notes: 'Control geometry visually checked against the official mapping: three standalone push buttons (1-3), one two-direction switch (4/5), ministick center push (6), two four-way hats (7-14), separate eight-way POV, main throttle, analog rudder rocker and continuous antenna thumbwheel. These are five analog axes. The numbered switch contacts are not standalone physical buttons. Undocumented center clicks remain unknown.'
