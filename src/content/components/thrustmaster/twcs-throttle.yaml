verdict:
  author: feiko
  hands_on: true
  owned_hours: 600
  take: "The default budget throttle for flight sim and DCS entry. It gives you an analog ministick and rear rudder rocker, but the stock S.M.A.R.T sliding rails suffer from sticktion unless re-greased with Nyogel 767A or modified with polymer bearings."
  pros:
    - "Generous control layout with analog ministick and finger rudder paddle"
    - "Hall sensor on main throttle sliding axis"
    - "Accessible budget pricing for standalone throttle"
  cons:
    - "Stock rail sticktion causes stutters during fine carrier landings or formation flying"
    - "Single throttle axis (not split for dual engine)"
    - "Lightweight plastic body tends to slide on desks without sticky pads or clamping"
  great_for:
    - modern_jet
    - space_hotas
    - ww2
  skip_if:
    - "You want a dual-engine split throttle or heavy metal base"
  scores:
    build: 3
    feel: 3
    value: 4
    software: 2
    qc_support: 3
external_reviews:
  - reviewer: mysh
    url: https://www.youtube.com/watch?v=2z54NHzy_Gc
    summary: "Cheap sliding rail throttle and okay-ish stock. Grease it with Nyogel 767A, 774VH, or Tribosyn 320 and it goes from okay to good. Aftermarket slider and detent mods exist."
