verdict:
  author: feiko
  hands_on: true
  owned_hours: 800
  take: The universal budget entry point. Accurate H.E.A.R.T hall sensor on the main X/Y axes and true ambidextrous
    modular grips make it cheap to start HOSAS, but the twist potentiometer is notorious for early failure.
  pros:
  - 16-bit Hall effect magnetic sensors on primary X/Y axes
  - Fully ambidextrous with swappable left/right thumb rests
  - Very affordable and widely available in stores worldwide
  cons:
  - Single-spring ball-and-cup gimbal has a distinct center clunk and noticeable breakout force
  - Twist (Z) axis uses a cheap potentiometer prone to jitter and failure after 6-12 months
  - Only one hat and three buttons on the stick grip itself
  great_for:
  - space_hosas
  - modern_jet
  skip_if:
  - You have a budget over €150 and want durable contactless twist or modular cams
  scores:
    build: 3
    feel: 3
    value: 4
    software: 2
    qc_support: 3
