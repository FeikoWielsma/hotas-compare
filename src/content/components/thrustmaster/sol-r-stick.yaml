  checked: '2026-10-20'
  notes: Visually reconciled English manual pages 7-10 and 20-22. Two eight-way clickable hats, clickable
    ministick, clickable digital scroll wheel, three installed grip buttons, four two-position base toggles,
    eight backlit base pads, clickable encoder and four-position selector. Includes physical handedness
    selector; spare rear button and alternate POV mappings are not extra controls. Secondary trigger action
    remains unspecified. Published eight-axis total includes virtual axes; it is not an inventory of eight
    separate analog mechanisms.
