controls:
- type: lever
  kind: throttle_single
  analog: true
  location: handle
  label: Main throttle
  source: https://www.thrustmaster.com/en-us/products/viper-tqs/
- type: detent
  count: 2
  customizable: false
  location: handle
  label: Cut Off and Afterburner stops (Afterburner stop removable)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
- type: trigger
  count: 1
  stages: 1
  action: flip
  location: handle
  label: Engine cut-off unlocking trigger
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
- type: hat
  ways: 4
  push: true
  location: handle
  label: Hat 1 (mapping button 5)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
- type: toggle
  count: 1
  ways: 3
  location: handle
  label: Three-position switch (mapped 15-14-13)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
- type: button
  count: 4
  location: handle
  label: Handle buttons 7, 8, 16 and top button 17
  notes: Mapped 18 (cut-off) and 19 (afterburner) are the stop-switch inputs covered by the detent and trigger entries. 13-15 are the three-position switch, not extra push buttons.
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
- type: rotary
  mode: analog
  count: 3
  location: handle
  label: Analog rotary axes (mapped 6 Rx, 9-10 Ry, 11)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
- type: analog_ministick
  push: false
  count: 1
  location: handle
  label: XY slew control (mapping axis 12)
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
controls_evidence:
  coverage: complete
  source: https://ts.thrustmaster.com/download/accessories/Manuals/Viper/Viper_Mission_Pack_User_Manual.pdf
  checked: '2026-10-20'
  notes: >-
    Handle only; the Viper Panel is a separate record. Mode A map (manual printed page 8) is titled 19 buttons and 5
    axes without virtual buttons. Hat directions are 1-4 with center push 5. Knob 6 is the Rx axis, the thumbwheel is
    the Ry axis (numbers 9-10 stay on that wheel), knob 11 is the third rotary, and 12 is the XY slew. 15-14-13 is one
    three-position switch. Push buttons are 7, 8, 16 and the separate top button 17. 18 and 19 are the cut-off and
    afterburner stops. Momentary behavior of the three-position switch is not stated. Marketing's 21 includes virtual
    buttons and is not the physical count.
