brand: thrustmaster
name: T.Flight Stick X
category: stick_fixed
status: current
platform_compatibility:
  pc: supported
  xbox: unknown
  ps5: unknown
  notes: Official eshop product table lists PC and PS3. PS3 has no schema field; PS5 and Xbox are not stated.
  sources:
