verdict:
  author: feiko
  hands_on: false
  take: "The left-handed twist version of the CDT-Aeromax. Offers 4 full analog axes in one hand on an all-metal cam-and-spring gimbal with dry clutches, making it one of the most capable space HOSAS strafe sticks on the market."
  pros:
    - "Left-hand ergonomic flight stick with integrated contactless twist Z-axis"
    - "All-metal compact cam and spring gimbal"
    - "Adjustable dry clutches for non-centering throttle/strafe use in space flight"
  cons:
    - "Max 1 optional throttle lever module can be installed on Z-axis variant"
  great_for:
    - space_hosas
    - airliner
  skip_if:
    - "You use foot pedals for vertical/lateral strafe"
  scores:
    build: 5
    feel: 5
    value: 5
    software: 4
    qc_support: 5
