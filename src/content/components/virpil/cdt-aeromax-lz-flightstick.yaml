controls_evidence:
  coverage: partial
  source: https://virpil-controls.eu/cdt-aeromax-lz-flightstick-omnithrottle.html
  checked: '2026-10-19'
  notes: Exact SKU VPC-120-LZ. The product listing describes the AEROMAX grip design but does not enumerate its physical inputs. The CDT-AERO L listing says its grip uses the same design introduced with AEROMAX and enumerates a control set; its official mapping sheet shows button outputs and rX/rY/rZ/SLDR axes. The mapping sheet has blank profile/revision fields and does not identify this fixed-stick SKU, so retain partial coverage pending a revision-matched AEROMAX control list. Optional throttle modules are not included in this inventory.
