verdict:
  author: feiko
  hands_on: true
  owned_hours: 500
  take: "The benchmark standalone flight sim throttle. Modular physical detent system, dual split throttle with physical finger-lift lock, and generous tactile switches on the heavy metal control panel."
  pros:
    - "Modular physical detents with 4 interchangeable plates included"
    - "Finger-lift locks for afterburner and idle cut-off"
    - "Massive all-metal base with backlit buttons and heavy duty 3-way toggles"
    - "Independent analog flaps lever and ministick on the throttle grip"
  cons:
    - "Large footprint requires dedicated desk space or sturdy mount"
    - "Higher price tier"
  great_for:
    - modern_jet
    - ww2
    - space_hotas
  skip_if:
    - "You fly purely dual-stick (HOSAS) in space sims"
    - "Small, crowded desk with no mounting option"
  scores:
    build: 5
    feel: 5
    value: 4
    software: 4
    qc_support: 5
