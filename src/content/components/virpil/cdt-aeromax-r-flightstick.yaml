verdict:
  author: feiko
  hands_on: false
  take: "VIRPIL's groundbreaking standalone desktop flight stick. Packs a true compact all-metal cam-and-spring gimbal with interchangeable cams, springs, adjustable grip offset, and integrated dry clutches directly into a compact desktop form factor for €199.95 (excl. VAT)."
  pros:
    - "First truly compact all-metal cam and spring standalone flightstick"
    - "Integrated adjustable dry clutch dampers for smooth motion or dead-stick heli flying"
    - "Contactless digital sensors across all axes"
    - "Adjustable grip offset angle"
    - "Supports up to 2 optional add-on throttle lever modules on each side"
  cons:
    - "No twist Z-axis (choose RZ variant if twist yaw is needed without rudder pedals)"
    - "Check batch pre-order availability on EU store"
  great_for:
    - modern_jet
    - space_hotas
    - ww2
  skip_if:
    - "You need built-in twist rudder (pick CDT-Aeromax RZ instead)"
  scores:
    build: 5
    feel: 5
    value: 5
    software: 4
    qc_support: 5
external_reviews:
  - reviewer: mysh
    url: https://www.youtube.com/watch?v=2z54NHzy_Gc
    summary: "First really compact all-metal cam and spring gimbal in a standalone stick. Sits between the Gladiators and full size bases in smoothness. Contactless everything, integrated dampers, adjustable grip offset. Especially viable in the EU."
