verdict:
  author: feiko
  hands_on: false
  take: "Left-handed version of the CDT-Aeromax. Ideal for southpaw pilots, Airbus captain side-stick setups, and 6DOF space HOSAS pilots wanting premium metal cam feel on the strafe hand."
  pros:
    - "Full left-handed ergonomic grip on compact metal cam-and-spring gimbal"
    - "Can mount up to 2 optional throttle lever modules on each side"
    - "Adjustable dry clutches for non-centering translation control in space"
  cons:
    - "No twist axis (see LZ variant for twist rudder)"
  great_for:
    - space_hosas
    - airliner
  skip_if:
