controls_evidence:
  coverage: complete
  source: https://virpil-controls.eu/cdt-aeromax-rz-flightstick-omnithrottle.html
  checked: '2026-10-20'
  notes: Exact-SKU product page embeds a labeled grip diagram (dual-stage trigger, flip trigger, three 4-way hats with push, three push buttons, analogue ministick, 2-way slider, paddle switch, brake lever axis, lockable twist). The AEROMAX mapping sheet linked from these listings names X/Y, twist Z, brake RZ, ministick RX/RY with a center push, and slider axis SL. Two side levers drawn on that sheet, one marked DL, are the optional throttle modules sold separately and are not part of this bare stick. Programmable LEDs on the diagram are indicators, not inputs.
