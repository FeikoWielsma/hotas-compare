  notes: 'SKU VPC-403-001. Counts are the section titled "UNIVERSAL CONTROL PANEL #3 INPUTS". MongoosT-50CM3 throttle paragraphs elsewhere on the page were not used. The mapping diagram names the four lever axes X, Y, RX, and RY and shows a center push on the mode dial. Optional axis-handle cosmetics are a separate product and do not add inputs.'
