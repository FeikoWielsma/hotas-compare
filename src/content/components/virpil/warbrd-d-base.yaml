  take: "The best desktop-friendly cam base on the market. The addition of adjustable dry clutches in the 'D' revision makes it exceptionally versatile across helicopters, space, and jets."
  pros:
    - "Dual-cam metal gimbal with interchangeable cams and springs"
    - "Independently adjustable dry clutch dampers for smooth resistance or dead-stick heli flying"
