  take: 'Draft assessment: Gladiator NXT EVO Omni-Throttle (Left) is a purpose-built
    stick_fixed for sim pilots who value precise inputs and configurable controls.
    Confirm regional configuration and included accessories before purchase.'
  pros:
  - Angled Omni-Throttle adapter creates natural left-hand throttle posture
  - Can be configured with axis springs/clutch for space movement
  - Full SCG control set and integrated base controls
  cons:
  - Angle is specialized and takes desk space
  - Not a conventional linear throttle
