controls_evidence:
  coverage: complete
  source: https://vkbsimcontrollers.com/products/stecs-throttle-system-mk-ii-max-us
  checked: '2026-10-19'
  notes: Exact STECS Modern Throttle System Mk.II Max (current product page/revision);
    Mk.I differs. MTG-R has two installed center-push 4-way hats; the three included
    5-way hat modules are replacement modules. Each grip has two triggers; the physical
    buttons are two on MTG-L and three on MTG-R. STEM has eight standalone buttons
    plus two K-switches with integrated center pushes, two push encoders, and two
    separate three-position flip switches (one self-centering). ATEM adds 6 buttons
    and a 4-way directional rotary encoder with center push. Detent frame/inserts
    are configurable alternatives; installed detent count is not asserted.
