  source: https://vkbsimcontrollers.com/products/mcg-ultimate-add-on-grip-for-gunfighter-mk-iv-us

controls_evidence:

  coverage: partial

  source: https://vkbsimcontrollers.com/products/mcg-ultimate-add-on-grip-for-gunfighter-mk-iv-us

  checked: '2026-10-19'

  notes: "The exact Mk.IV RevC listing specifies two slew axes, two trimmer axes, a brake lever, dual-stage main trigger and two-position folding trigger. The mini-stick and hat modules are interchangeable; the alternative hat module is not counted as a simultaneous extra control. The 24–32 figure is programmable/logical button count, not a standalone physical button inventory; exact hat direction count and push behavior are not enumerated. The twist adapter is a separate selectable variant and is not intrinsic to the base grip SKU."

