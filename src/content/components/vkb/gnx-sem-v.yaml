  notes: Counts and control actions verified against official VKB SEM-V template (VKB-SEM-V-v1.0.pdf) and product page. Features two multi-function analog levers with contactless MaRS sensors (Flaps with 4 marked detent positions, Gear with 3 positions UP/-/DN), 4-position Mode rotary switch, two 3-way momentary K-switches with center push, and seven non-backlit push buttons.
