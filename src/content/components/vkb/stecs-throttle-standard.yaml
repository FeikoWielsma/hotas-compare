  notes: Exact STECS Modern Throttle System Mk.II Standard (current product page/revision);
    Mk.I differs. The EU specification explicitly lists one 4-way center-push hat
    on MTG-R, three MTG-R buttons plus two MTG-L buttons, and two triggers on each
    grip. STEM has eight standalone buttons, two K-switches with integrated center
    pushes, two encoders with center pushes, one self-centering 3-position flip switch,
    and one other 3-position flip switch. The three included 5-position hat modules
    are replacements, not installed controls. Detent frame/inserts are configurable
    alternatives; installed detent count is not asserted.
