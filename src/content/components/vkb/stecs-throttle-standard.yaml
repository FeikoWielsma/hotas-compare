verdict:
  author: feiko
  hands_on: false
  take: 'Draft assessment: STECS Throttle Standard is a purpose-built throttle for
    sim pilots who value precise inputs and configurable controls. Confirm regional
    configuration and included accessories before purchase.'
  pros:
  - Modular throttle lever and configurable detents
  - Numerous controls in a compact standalone throttle
  - Interchangeable modules and adjustable friction
  cons:
  - Configuration options can overwhelm new users
  - Mostly polymer exterior
  great_for:
  - modern_jet
  - ww2
  - space_hotas
  skip_if:
  - Configuration options can overwhelm new users
