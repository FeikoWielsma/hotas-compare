verdict:
  author: feiko
  hands_on: true
  owned_hours: 500
  take: The best pedal choice if you fly from an office chair on wheels. Up-and-down
    heel push motion prevents your chair from rolling backwards, built entirely from
    solid steel and aluminum.
  pros:
  - Heel-press vertical axis prevents office chairs on castors from pushing back
  - Indestructible all-metal construction
  - Compact footprint fits easily under any standard computer desk
  - Reversible cam profile for hard or soft center detent
  cons:
  - Single rudder axis only — no physical toe brakes (relies on virtual differential
    braking in software)
  great_for:
  - heli
  - space_hotas
  - modern_jet
  skip_if:
  - You fly warbirds or GA and insist on physical toe brakes on both pedals
  scores:
    build: 5
    feel: 5
    value: 5
