brand: vkb
name: STECS STEM (Standard Throttle Extension Module)
category: module
platform_compatibility:
  pc: supported
  xbox: unsupported
  ps5: unsupported
  notes: VKB Australia FAQ states VKB controllers are compatible with Windows PCs
    and not compatible with Xbox, PS5, Apple or other platforms. The STEM is an
    extension of a STECS base and uses that base's USB connection.
  sources:
  - https://vkbsimcontrollers.com/products/stecs-stem-standard-throttle-extension-module-us
  - https://vkb-sim.com.au/collections/all-controllers
status: current
handedness: n/a
mount: null
placement: mount_only
controls:
- type: button
  count: 8
  backlit: false
  location: panel
  label: Push buttons A1, A2, B1-B5, C1
  source: https://vkbsimcontrollers.com/products/stecs-stem-standard-throttle-extension-module-us
- type: toggle
  count: 2
  ways: 3
  momentary: true
  push: true
  location: panel
  label: K-switches SW1 and SW2 with central push
  source: https://vkbsimcontrollers.com/products/stecs-stem-standard-throttle-extension-module-us
- type: encoder
  count: 2
  push: true
  location: panel
  label: Encoders EN1 and EN2 with central push
  source: https://vkbsimcontrollers.com/products/stecs-stem-standard-throttle-extension-module-us
- type: toggle
  count: 1
  ways: 3
  momentary: true
  push: false
  location: panel
  label: Self-centering 3-position flip switch
  source: https://vkbsimcontrollers.com/products/stecs-stem-standard-throttle-extension-module-us
- type: toggle
  count: 1
  ways: 3
  momentary: false
  push: false
  location: panel
  label: 3-position latching flip switch (landing gear lever)
  source: https://vkbsimcontrollers.com/products/stecs-stem-standard-throttle-extension-module-us
controls_evidence:
  coverage: complete
  source: https://vkbsimcontrollers.com/products/stecs-stem-standard-throttle-extension-module-us
  checked: '2026-10-20'
  notes: Counts from official VKB STEM template (VKB-STECS-STEM-v1.0.pdf) and product
    page (8 non-backlit buttons, 2 K-switches with central push, 2 encoders with push, one self-centering
    and one latching 3-position flip switch). Latching and self-centering behavior follows
    STECS Standard and Max records. Only one STEM can be installed per STECS.
hardware: null
connectivity:
  usb: none as supplied; cable to STECS base (Type-C to Type-C)
  standalone_usb: false
