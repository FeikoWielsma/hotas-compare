  take: 'Draft assessment: Gunfighter Mk.IV Base is a purpose-built base for sim pilots
    who value precise inputs and configurable controls. Confirm regional configuration
    and included accessories before purchase.'
  pros:
  - Metal gimbal with interchangeable space and aviation cams
  - Spring selection and adjustable dry clutches
  - Rev.C connector and extension support
  cons:
  - Base requires a separate compatible grip
  - Setup and cam tuning are more involved than entry-level sticks
