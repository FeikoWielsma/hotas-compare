  take: 'Draft assessment: F-14 Combat Grip is a purpose-built grip for sim pilots
    who value precise inputs and configurable controls. Confirm regional configuration
    and included accessories before purchase.'
  pros:
  - Tomcat-inspired weapon selector and DLC axis
  - Lockable contactless twist axis
  - Tactile dual-stage trigger and programmable buttons
  cons:
